server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: rental-server
  # 默认使用开发环境配置（本机 Windows MySQL）
  profiles:
    active: dev
  # 文件上传大小限制
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    # 数据库 create_time -> Java createTime 自动映射
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
